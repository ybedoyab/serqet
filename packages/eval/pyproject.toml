[project]
name = "serqet"
version = "0.1.0"
description = "SERQET healthcare agent authority and consent benchmark"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "ybedoyab" }]
dependencies = ["pydantic>=2.10,<3"]

[project.scripts]
serqet = "serqet.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.8,<1", "mypy>=1.13,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["serqet"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["serqet", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_unused_ignores = true
check_untyped_defs = true
packages = ["serqet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
